services:
  backend:
    build:
      context: .
    ports:
      - "7000:7000"
    environment:
      PORT: 7000
      DB_NAME: ${DB_NAME}
      DB_PORT: 3306
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mysql_3
      DB_USER: root
    depends_on:
      mysql_3:
        condition: service_healthy

  mysql_3:
    image: mysql:latest
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: